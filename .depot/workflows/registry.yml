name: Registry

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: depot-ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Depot mounts RUNNER_TOOL_CACHE root-owned; setup-node (and anything
      # else using @actions/tool-cache) EACCES-fails without the chown.
      - name: Fix Tool Cache Permissions
        run: |
          sudo mkdir -p "$RUNNER_TOOL_CACHE"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TOOL_CACHE"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # formatting, schema, and build
      - name: Registry check
        run: bun run registry:check

      - name: Unit tests
        run: bun run test

      # installs the working-tree bundles into the aligned baseline, resolves real
      # dependencies, type-checks, and verifies idempotence + app-owned contracts.
      - name: Install smoke test
        run: bun run smoke
