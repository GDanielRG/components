name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Bun Audit
        shell: bash
        env:
          # braces has no patched release for GHSA-vfj7-8cjw-p6xm; from 00:00 UTC on this date the audit runs unfiltered again.
          BRACES_ADVISORY_IGNORED_UNTIL: '2026-11-05'
        run: |
          today="$(date -u +%Y-%m-%d)"
          for day in "$today" "$BRACES_ADVISORY_IGNORED_UNTIL"; do
            [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::Expected YYYY-MM-DD dates, got '$day'."; exit 1; }
            canonical="$(date -u -d "$day" +%Y-%m-%d)"
            [[ "$canonical" == "$day" ]] || { echo "::error::Expected a real calendar date, got '$day'."; exit 1; }
          done
          if [[ "$today" < "$BRACES_ADVISORY_IGNORED_UNTIL" ]]; then
            bun audit --ignore=GHSA-vfj7-8cjw-p6xm
          else
            bun audit
          fi
      - run: bun run test
      - run: bun run registry:check
      - run: bun run smoke
